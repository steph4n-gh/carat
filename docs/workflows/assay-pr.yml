# Drop-in GitHub Actions workflow for Assay pull request checks (SPEC section 10.3).
# Runs strictly from the protected base revision (`pull_request_target`) without ever
# executing PR head code. Maintainers approve stops by commenting:
#   assay approve <subject>
name: Assay Dependency Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  assay:
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'assay approve '))
    runs-on: ubuntu-latest
    env:
      ASSAY_RELEASE_URL: "https://github.com/REPLACE_ORG/assay/releases/download/v0.1.0/assay-x86_64-unknown-linux-gnu.tar.gz"
      ASSAY_SHA256: "REPLACE_WITH_RELEASE_SHA256"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout protected base revision (never executes PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR refs and collaborator approval comments
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const out = [];
            for (const c of comments) {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: c.user.login,
              });
              const hasWrite = ['admin', 'maintain', 'write'].includes(perm.data.permission);
              out.push({
                author: c.user.login,
                body: c.body || '',
                has_write_access: hasWrite,
                created_at: c.created_at,
              });
            }
            const fs = require('fs');
            fs.writeFileSync('/tmp/pr-comments.json', JSON.stringify(out));
            core.setOutput('number', String(prNum));
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);
            core.setOutput('author', pr.user.login);

      - name: Fetch PR head commit objects only (no checkout)
        run: |
          git fetch --no-tags origin "pull/${{ steps.pr.outputs.number }}/head:refs/assay/pr-head"

      - name: Install SHA-256 pinned Assay release binary
        run: |
          if [ -n "${ASSAY_BIN:-}" ] && [ -x "${ASSAY_BIN}" ]; then
            cp "${ASSAY_BIN}" ./assay
            exit 0
          fi
          if [ "${ASSAY_SHA256}" = "REPLACE_WITH_RELEASE_SHA256" ]; then
            echo "Set ASSAY_RELEASE_URL and ASSAY_SHA256 in .github/workflows/assay-pr.yml before enabling." >&2
            exit 2
          fi
          curl -fsSL --proto '=https' -o /tmp/assay.tar.gz "${ASSAY_RELEASE_URL}"
          echo "${ASSAY_SHA256}  /tmp/assay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/assay.tar.gz -C /tmp
          cp /tmp/assay ./assay
          chmod +x ./assay

      - name: Run Assay PR gate (single evaluation)
        id: run
        run: |
          set +e
          READ_ARGS=()
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            READ_ARGS=(--read)
          fi
          ./assay pr \
            --base "${{ steps.pr.outputs.base }}" \
            --head "refs/assay/pr-head" \
            --comments-json /tmp/pr-comments.json \
            --pr-author "${{ steps.pr.outputs.author }}" \
            "${READ_ARGS[@]}" > /tmp/assay-summary.md
          STATUS=$?
          ./assay pr \
            --base "${{ steps.pr.outputs.base }}" \
            --head "refs/assay/pr-head" \
            --comments-json /tmp/pr-comments.json \
            --pr-author "${{ steps.pr.outputs.author }}" \
            --json > /tmp/assay-report.json
          cat /tmp/assay-summary.md
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post or update PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/assay-summary.md', 'utf8');
            const marker = '<!-- assay-pr-report -->';
            const body = `${marker}\n\`\`\`text\n${summary.slice(0, 60000)}\n\`\`\``;
            const prNum = Number('${{ steps.pr.outputs.number }}');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }

      - name: Upload Assay artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assay-report
          path: |
            /tmp/assay-summary.md
            /tmp/assay-report.json

      - name: Fail check if unapproved stops remain
        if: steps.run.outputs.exit_code != '0'
        run: exit "${{ steps.run.outputs.exit_code }}"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            linker: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross-linker
        if: matrix.apt_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_pkg }}

      - name: Run workspace tests (native targets)
        if: "!matrix.cross"
        run: cargo test --workspace --locked

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin carat

      - name: Package tarball and SHA-256 checksum
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/carat" dist/carat
          chmod +x dist/carat
          TARBALL="carat-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "${TARBALL}" carat
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          else
            shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          fi
          cat "${TARBALL}.sha256"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: carat-${{ matrix.target }}
          path: |
            carat-${{ matrix.target }}.tar.gz
            carat-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble SHA256SUMS.txt
        run: |
          cd release-assets
          LC_ALL=C sort *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz \
            release-assets/*.tar.gz.sha256 \
            release-assets/SHA256SUMS.txt \
            --title "Carat ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
